<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network access at all: the page cannot send a file or password anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src blob:">
<title>KNS Reader</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1c1b19; --muted: #6b6862; --line: #dedbd4;
    --accent: #2f5d50; --accent-text: #ffffff; --error: #a3261f; --error-bg: #fbeceb;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #201f1d; --text: #ecebe7; --muted: #a09d96; --line: #35332f;
      --accent: #7fc4ae; --accent-text: #10201b; --error: #ff9d94; --error-bg: #3a1d1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { margin: 0; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  header { margin-bottom: 24px; }

  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .drop {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 36px 16px; cursor: pointer;
    background: var(--card); border: 2px dashed var(--line); border-radius: 12px; text-align: center;
  }
  .drop.over, .drop:hover, #file:focus-visible + .drop { border-color: var(--accent); }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); padding: 8px 0; }
  textarea, input[type=password], input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; margin-bottom: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button { font: inherit; min-height: 44px; padding: 0 18px; border-radius: 8px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.secondary { background: transparent; color: var(--accent); }
  button.link { min-height: 0; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 400; text-decoration: underline; }
  button:disabled { opacity: 0.6; cursor: default; }

  .error { margin: 16px 0; padding: 12px 14px; border-radius: 8px; background: var(--error-bg); color: var(--error); overflow-wrap: anywhere; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; overflow-wrap: anywhere; }
  .bar button { flex: none; }
  form { margin-bottom: 20px; }
  form label { display: block; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  form label.check { font-weight: 400; margin: 10px 0 0; color: var(--muted); }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 0.875rem; overflow-wrap: anywhere; }
  .meta strong { font-weight: 600; }
  .body { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .body.locked, .body.failed { color: var(--muted); font-style: italic; }
  .body.failed { color: var(--error); }
  .body img { display: block; max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 6px; }
  .body a { color: var(--accent); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>KNS Reader</h1>
    <p class="muted">Open an encrypted .kns message file. Nothing is uploaded: the file and password stay on this device.</p>
  </header>

  <section id="pick">
    <input id="file" type="file" class="visually-hidden">
    <label id="drop" class="drop" for="file">
      <strong>Choose a .kns file</strong>
      <span class="muted">or drop it here</span>
    </label>
    <details>
      <summary>Paste the file's text instead</summary>
      <textarea id="paste" rows="7" spellcheck="false" autocapitalize="off" aria-label="Text of the .kns file"></textarea>
      <button id="usePaste" type="button" class="secondary">Open pasted text</button>
    </details>
  </section>

  <p id="error" class="error" role="alert" hidden></p>

  <section id="opened" hidden>
    <div class="bar">
      <span id="summary"></span>
      <button id="reset" type="button" class="link">Open another file</button>
    </div>
    <form id="unlock">
      <label for="password">Password</label>
      <div class="row">
        <input id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="go">Unlock</button>
      </div>
      <label class="check"><input id="show" type="checkbox"> Show password</label>
    </form>
    <ol id="messages"></ol>
  </section>
</main>

<!-- The .kns format and decryption. Mirrors kns/format.py and kns/crypto.py. No page code in here. -->
<script id="kns-core">
"use strict";
const MAGIC = "#KNS v1";
const BLOCK_START = "[message]";
const SEPARATOR = "---";
const FILE_REQUIRED = ["cipher", "kdf", "iterations", "salt"];
const BLOCK_REQUIRED = ["type", "nonce"];
const KEY_PATTERN = /^[a-z0-9_]+$/;
const BASE64 = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/;
const MAX_ITERATIONS = 10000000;
const IMAGE_NAME = /^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}$/;
const IMAGE_TYPES = new Map([["png", "image/png"], ["jpg", "image/jpeg"], ["jpeg", "image/jpeg"], ["gif", "image/gif"], ["webp", "image/webp"]]);

class KnsError extends Error {
  constructor(message, line) {
    super(line ? `line ${line}: ${message}` : message);
    this.line = line;
  }
}

function parse(text) {
  const lines = text.split(/\r\n|\r|\n/).map((line) => line.trim());
  if (lines[0] !== MAGIC) throw new KnsError(`missing or wrong magic line, expected '${MAGIC}'`, 1);

  const kns = { header: new Map(), blocks: [] };
  let block = null; // the block being read. null while still in the file header
  let inPayload = false;

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    const number = i + 1;
    if (!line) continue;
    if (line === BLOCK_START) {
      finish(kns, block, inPayload);
      block = { header: new Map(), payload: "", line: number };
      inPayload = false;
    } else if (inPayload) {
      block.payload += line;
    } else if (line.startsWith("#")) {
      continue;
    } else if (line === SEPARATOR && block) {
      inPayload = true;
    } else {
      readHeaderLine(line, number, block ? block.header : kns.header);
    }
  }
  finish(kns, block, inPayload);
  return kns;
}

function readHeaderLine(line, number, header) {
  const colon = line.indexOf(":");
  if (colon === -1) throw new KnsError("expected 'key: value'", number);
  const key = line.slice(0, colon).trim();
  const value = line.slice(colon + 1).trim();
  if (!KEY_PATTERN.test(key)) throw new KnsError(`invalid key '${key}', only a-z, 0-9 and _ are allowed`, number);
  if (header.has(key)) throw new KnsError(`duplicate key '${key}'`, number);
  header.set(key, value);
}

// Check the section that just ended: the file header, or one block.
function finish(kns, block, inPayload) {
  if (!block) {
    for (const key of FILE_REQUIRED) {
      if (!kns.header.has(key)) throw new KnsError(`missing required file header field '${key}'`);
    }
    return;
  }
  if (!inPayload) throw new KnsError(`message has no '${SEPARATOR}' separator`, block.line);
  for (const key of BLOCK_REQUIRED) {
    if (!block.header.has(key)) throw new KnsError(`missing required field '${key}'`, block.line);
  }
  if (!block.payload) throw new KnsError("empty payload", block.line);
  if (kns.blocks.some((other) => other.header.get("nonce") === block.header.get("nonce"))) {
    throw new KnsError("same nonce as an earlier message", block.line);
  }
  kns.blocks.push(block);
}

// Returns the media type for a safe image file name, or throws.
function imageType(name) {
  name = name || "";
  const dot = name.lastIndexOf(".");
  const type = dot === -1 ? undefined : IMAGE_TYPES.get(name.slice(dot + 1).toLowerCase());
  if (!IMAGE_NAME.test(name) || !type) {
    throw new KnsError("image name must use only letters, digits, . _ - and end in .png, .jpg, .jpeg, .gif or .webp");
  }
  return type;
}

function decodeBase64(text, name, length) {
  if (!BASE64.test(text)) throw new KnsError(`${name} is not valid base64`);
  const binary = atob(text);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  if (length !== undefined && bytes.length !== length) {
    throw new KnsError(`${name} must be ${length} bytes, got ${bytes.length}`);
  }
  return bytes;
}

// Password + salt -> the AES key. Slow on purpose.
async function deriveKey(password, fileHeader) {
  if (fileHeader.get("cipher") !== "aes-256-gcm") throw new KnsError(`unsupported cipher '${fileHeader.get("cipher")}'`);
  if (fileHeader.get("kdf") !== "pbkdf2-sha256") throw new KnsError(`unsupported kdf '${fileHeader.get("kdf")}'`);
  const text = fileHeader.get("iterations");
  const iterations = /^[0-9]+$/.test(text) ? Number(text) : 0;
  if (iterations < 1 || iterations > MAX_ITERATIONS) {
    throw new KnsError(`iterations must be a whole number from 1 to ${MAX_ITERATIONS}`);
  }
  const salt = decodeBase64(fileHeader.get("salt"), "salt", 16);
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt, iterations },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

// Decrypt block number `index` (the first block is 1). Returns the bytes.
async function decryptBlock(key, index, block) {
  const nonce = decodeBase64(block.header.get("nonce"), "nonce", 12);
  const ciphertext = decodeBase64(block.payload, "payload");
  if (ciphertext.length < 16) throw new KnsError(`message ${index}: payload is too short`);
  // Not secret, but AES-GCM refuses to decrypt if any of it differs.
  const parts = ["KNS1", String(index), block.header.get("type"), block.header.get("from") || "", block.header.get("date") || ""];
  if (block.header.has("name")) parts.push(block.header.get("name"));
  const additionalData = new TextEncoder().encode(parts.join("\n"));
  try {
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce, additionalData }, key, ciphertext));
  } catch (error) {
    throw new KnsError(`message ${index}: wrong password, or the file was changed`);
  }
}
</script>

<!-- The page itself. -->
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let current = null; // the parsed file that is open

function showError(message) {
  $("error").textContent = message;
  $("error").hidden = !message;
}

function openText(text, name) {
  showError("");
  try {
    current = parse(text);
  } catch (error) {
    if (!(error instanceof KnsError)) throw error;
    showError(`This is not a valid .kns file (${error.message}).`);
    return;
  }
  const count = current.blocks.length;
  $("summary").textContent = `${name}: ${count} ${count === 1 ? "message" : "messages"}`;
  $("pick").hidden = true;
  $("opened").hidden = false;
  $("unlock").hidden = count === 0;
  render(null);
  if (count) $("password").focus();
}

// results is null while locked, else one {text} or {error} per block.
function render(results) {
  const list = $("messages");
  list.replaceChildren();
  current.blocks.forEach((block, i) => {
    const item = document.createElement("li");
    const meta = document.createElement("div");
    meta.className = "meta";
    const sender = document.createElement("strong");
    sender.textContent = block.header.get("from") || "Unknown sender";
    const date = document.createElement("span");
    date.className = "muted";
    date.textContent = block.header.get("date") || "No date";
    meta.append(sender, date);

    const body = document.createElement("div");
    const result = results && results[i];
    if (!result) {
      body.className = "body locked";
      body.textContent = "Locked";
    } else if (result.error) {
      body.className = "body failed";
      body.textContent = result.error;
    } else if (result.image) {
      body.className = "body";
      const image = document.createElement("img");
      image.src = result.image;
      image.alt = result.name;
      image.addEventListener("error", () => {
        body.className = "body failed";
        body.textContent = "This image could not be displayed.";
      });
      const save = document.createElement("a");
      save.href = result.image;
      save.download = result.name;
      save.textContent = `Save ${result.name}`;
      body.append(image, save);
    } else {
      body.className = "body";
      body.textContent = result.text;
    }
    item.append(meta, body);
    list.append(item);
  });
}

const imageUrls = []; // decrypted images held in memory, released on reset

async function readBlock(key, index, block) {
  const type = block.header.get("type");
  try {
    if (type === "text") {
      const bytes = await decryptBlock(key, index, block);
      return { text: new TextDecoder("utf-8", { fatal: true }).decode(bytes) };
    }
    if (type === "image") {
      const name = block.header.get("name");
      const mediaType = imageType(name);
      const bytes = await decryptBlock(key, index, block);
      const url = URL.createObjectURL(new Blob([bytes], { type: mediaType }));
      imageUrls.push(url);
      return { image: url, name };
    }
    return { error: `This reader cannot show type '${type}'.` };
  } catch (error) {
    if (!(error instanceof KnsError)) return { error: "This message is not valid text." };
    if (error.message.includes("wrong password")) {
      return { error: "Could not be decrypted. It may have been changed.", badKey: true };
    }
    return { error: `Could not be read (${error.message}).` };
  }
}

$("unlock").addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = $("password").value;
  if (!password) return showError("Type the password first.");
  showError("");
  $("go").disabled = true;
  $("go").textContent = "Unlocking…";
  try {
    const key = await deriveKey(password, current.header);
    const results = [];
    for (let i = 0; i < current.blocks.length; i++) {
      results.push(await readBlock(key, i + 1, current.blocks[i]));
    }
    if (results.every((result) => result.error)) {
      const badKey = results.some((result) => result.badKey);
      showError(badKey ? "Wrong password, or the file was changed." : results[0].error);
    } else {
      render(results);
      $("unlock").hidden = true;
      $("password").value = "";
    }
  } catch (error) {
    showError(error instanceof KnsError ? `This file cannot be decrypted (${error.message}).` : String(error));
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Unlock";
  }
});

$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  if (file) openText(await file.text(), file.name);
});

$("usePaste").addEventListener("click", () => {
  if ($("paste").value.trim()) openText($("paste").value, "Pasted text");
  else showError("Paste the text of a .kns file first.");
});

const drop = $("drop");
for (const name of ["dragenter", "dragover"]) {
  drop.addEventListener(name, (event) => { event.preventDefault(); drop.classList.add("over"); });
}
for (const name of ["dragleave", "drop"]) {
  drop.addEventListener(name, (event) => { event.preventDefault(); drop.classList.remove("over"); });
}
drop.addEventListener("drop", async (event) => {
  const file = event.dataTransfer.files[0];
  if (file) openText(await file.text(), file.name);
});

$("show").addEventListener("change", () => {
  $("password").type = $("show").checked ? "text" : "password";
});

$("reset").addEventListener("click", () => {
  current = null;
  imageUrls.splice(0).forEach((url) => URL.revokeObjectURL(url));
  $("file").value = "";
  $("paste").value = "";
  $("password").value = "";
  $("messages").replaceChildren();
  showError("");
  $("opened").hidden = true;
  $("pick").hidden = false;
});

if (!window.crypto || !crypto.subtle) {
  showError("This browser cannot decrypt here. Open the page over https.");
}
</script>
</body>
</html>
